; Laravel Reverb: the WebSocket server for live provisioning/teardown progress
; (docs/BROADCASTING.md).
;
; No --host/--port flags: `reverb:start` reads REVERB_SERVER_HOST / REVERB_SERVER_PORT
; from .env (config/reverb.php), so .env stays the single source of truth.
;
; WITHOUT THIS PROCESS provisioning still works (broadcast errors are caught and logged),
; but the admin pages stop updating live: the tenant page's status line says "unavailable".
;
; One Reverb per app. Don't also run `php artisan reverb:start` in a terminal: the second
; one fails with EADDRINUSE on the same port.
;
; Production: each open WebSocket uses a file descriptor. For many connections raise
; supervisord's own limit (`minfds` in the [supervisord] section), and put Reverb behind
; a TLS proxy (REVERB_HOST/PORT/SCHEME are then the public wss:// address).
;
; Deploy: after pulling code run `php artisan reverb:restart`. Reverb exits gracefully
; and supervisor (autorestart) starts it again on the new code.

[program:tenancey-reverb]
process_name=%(program_name)s
command=php /var/www/tenancey/artisan reverb:start
directory=/var/www/tenancey
autostart=true
autorestart=true
numprocs=1
startsecs=5
stopwaitsecs=30
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/supervisor/tenancey-reverb.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
