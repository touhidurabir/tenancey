; Tenancey: local dev daemons. Generated from deploy/supervisor/*.conf
; (paths localised, user= dropped). Regenerate if those files change.
;
; Install:  cp deploy/supervisor/local/tenancey.ini /usr/local/etc/supervisor.d/
;           supervisorctl reread && supervisorctl update
; The file must end in .ini: /usr/local/etc/supervisord.conf only includes supervisor.d/*.ini.

[program:tenancey-horizon]
process_name=%(program_name)s
command=/usr/local/bin/php /Users/abir/Sites/code/tenancey/artisan horizon
directory=/Users/abir/Sites/code/tenancey
autostart=true
autorestart=true
numprocs=1
startsecs=10
stopwaitsecs=660
redirect_stderr=true
stdout_logfile=/Users/abir/Sites/code/tenancey/storage/logs/supervisor-tenancey-horizon.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5

[program:tenancey-reverb]
process_name=%(program_name)s
command=/usr/local/bin/php /Users/abir/Sites/code/tenancey/artisan reverb:start
directory=/Users/abir/Sites/code/tenancey
autostart=true
autorestart=true
numprocs=1
startsecs=5
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=/Users/abir/Sites/code/tenancey/storage/logs/supervisor-tenancey-reverb.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
