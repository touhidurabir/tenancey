; Laravel Horizon: the ONLY queue worker process for this app.
;
; Horizon is a master process that starts and balances its own workers from
; config/horizon.php (default-, central- and provisioning-supervisor). So this is ONE
; supervisor program, numprocs=1. Never add a separate `queue:work` program alongside
; it: both would consume the same Redis queues.
;
; WITHOUT THIS PROCESS no tenant is ever provisioned or deleted. The admin UI saves the
; tenant row and shows "Provisioning" forever. Nothing errors.
;
; stopwaitsecs MUST exceed the longest job timeout (provisioning-supervisor: 600s).
; On stop/restart, Horizon lets running jobs finish. If supervisor's wait is shorter it
; SIGKILLs a tenant halfway through its chain (the jobs are idempotent and Retry
; recovers, but don't rely on it).
;
; Deploy: after pulling code run `php artisan horizon:terminate`. Horizon exits
; gracefully and supervisor (autorestart) starts it again on the new code.

[program:tenancey-horizon]
process_name=%(program_name)s
command=php /var/www/tenancey/artisan horizon
directory=/var/www/tenancey
autostart=true
autorestart=true
numprocs=1
startsecs=10
stopwaitsecs=660
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/supervisor/tenancey-horizon.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
