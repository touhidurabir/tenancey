# One server for the central domain and every tenant subdomain: Laravel tells them apart
# by the Host header (CENTRAL_DOMAIN vs {subdomain}.CENTRAL_DOMAIN).
server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;
    charset utf-8;
    client_max_body_size 20M;

    # Look container names up through Docker's own DNS server, and again after 10 seconds.
    # Without this, nginx resolves `app` once at start and keeps that IP: after `up -d`
    # recreates app (new IP), requests went to the old address (502).
    resolver 127.0.0.11 valid=10s;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP goes to PHP-FPM in the app container, port 9000. A variable makes nginx look the name
    # up per request (with the resolver above) instead of once at start.
    location ~ \.php$ {
        set $php_fpm app:9000;
        fastcgi_pass $php_fpm;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
