# Local development for tenancey. Guide: docs/DOCKER.md
# App: https://tenancey.test   Tenants: https://{subdomain}.tenancey.test (through docker-edge)
name: tenancey

# Docker-only settings. They win over .env because Laravel never overwrites a variable that is
# already set in the environment. Secrets (APP_KEY, TENANT_DB_KEY, REVERB_APP_*) stay in .env.
x-laravel-env: &laravel-env
  APP_URL: https://tenancey.test
  CENTRAL_DOMAIN: tenancey.test
  SESSION_SECURE_COOKIE: "true"
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_USERNAME: root
  DB_PASSWORD: docker
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  MAIL_HOST: mailpit
  MAIL_PORT: "1025"
  REVERB_HOST: reverb
  REVERB_PORT: "8080"
  REVERB_SCHEME: http
  REVERB_SERVER_HOST: 0.0.0.0
  REVERB_SERVER_PORT: "8080"
  ASSET_BUILD_DIRECTORY: build-docker
  FILESYSTEM_DISK: minio # new tenants; existing ones keep the disk they were created on
  MINIO_ENDPOINT: http://minio:9000 # PHP containers reach MinIO by its service name
  MINIO_PUBLIC_ENDPOINT: https://s3.tenancey.test # signed links: browser → Traefik → minio:9000
  MINIO_KEY: minioadmin
  MINIO_SECRET: minioadmin

# Shared by the four PHP services: same image, same code, same settings.
x-php: &php
  build: docker/php
  image: tenancey-php:dev
  volumes:
    - .:/var/www/html
  environment: *laravel-env
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_started
    minio:
      condition: service_started # no healthcheck to wait for (see the service)
  restart: unless-stopped

services:
  app:
    <<: *php # PHP-FPM, the image's default command

  horizon:
    <<: *php
    command: php artisan horizon
    stop_signal: SIGTERM # the image's SIGQUIT is for PHP-FPM; Horizon shuts down gracefully on SIGTERM
    stop_grace_period: 660s # must exceed the longest job timeout (600s), like supervisor's stopwaitsecs

  reverb:
    <<: *php
    command: php artisan reverb:start
    networks: [default, edge] # the browser: wss://ws.tenancey.test → Traefik; PHP containers: reverb:8080
    labels:
      traefik.enable: "true"
      traefik.docker.network: edge
      traefik.http.routers.tenancey-ws.rule: Host(`ws.tenancey.test`)
      traefik.http.routers.tenancey-ws.entrypoints: websecure
      traefik.http.routers.tenancey-ws.priority: "100"
      traefik.http.services.tenancey-ws.loadbalancer.server.port: "8080"
    stop_signal: SIGTERM # as for horizon: Reverb shuts down on SIGTERM, not the image's SIGQUIT
    stop_grace_period: 30s

  scheduler:
    <<: *php
    command: php artisan schedule:work # runs due tasks every minute; replaces a cron entry
    # No stop_signal: schedule:work handles SIGQUIT (and SIGTERM) itself, finishing running tasks first.

  nginx:
    image: nginx:1.30-alpine
    networks: [default, edge]
    labels:
      traefik.enable: "true"
      traefik.docker.network: edge
      # The central domain and every tenant. Priority 1, so the named side services win
      # (Traefik's default priority is the rule's length, and this rule is the longest).
      traefik.http.routers.tenancey.rule: 'Host(`tenancey.test`) || HostRegexp(`^[a-z0-9-]+\.tenancey\.test$$`)'
      traefik.http.routers.tenancey.entrypoints: websecure
      traefik.http.routers.tenancey.priority: "1"
      traefik.http.services.tenancey.loadbalancer.server.port: "80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: docker # local dev only; matches DB_PASSWORD for the PHP services
    ports:
      - "3307:3306" # Mac 3307 -> container 3306 (the Mac's own MySQL keeps 3306)
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pdocker"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    volumes:
      - redis-data:/data
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.29
    networks: [default, edge] # inbox: https://mail.tenancey.test (SMTP 1025 stays inside the network)
    labels:
      traefik.enable: "true"
      traefik.docker.network: edge
      traefik.http.routers.tenancey-mail.rule: Host(`mail.tenancey.test`)
      traefik.http.routers.tenancey-mail.entrypoints: websecure
      traefik.http.routers.tenancey-mail.priority: "100"
      traefik.http.services.tenancey-mail.loadbalancer.server.port: "8025"
    restart: unless-stopped

  minio:
    # Chainguard's free tier only publishes :latest, so pin the digest (:latest on 2026-10-12).
    image: cgr.dev/chainguard/minio@sha256:dc455cdd4db6e390b1b26514f15ff37681a777bf8dab41aac445a0259f751e56
    command: server /data --console-address :9001 # the image's entrypoint is `minio`
    environment:
      MINIO_ROOT_USER: minioadmin # local dev only, like MySQL's password
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_BROWSER_REDIRECT_URL: https://minio.tenancey.test # the dashboard's public address
    networks: [default, edge] # S3 API: https://s3.tenancey.test   dashboard: https://minio.tenancey.test
    labels:
      traefik.enable: "true"
      traefik.docker.network: edge
      traefik.http.routers.tenancey-s3.rule: Host(`s3.tenancey.test`)
      traefik.http.routers.tenancey-s3.entrypoints: websecure
      traefik.http.routers.tenancey-s3.priority: "100"
      traefik.http.routers.tenancey-s3.service: tenancey-s3
      traefik.http.services.tenancey-s3.loadbalancer.server.port: "9000"
      traefik.http.routers.tenancey-minio.rule: Host(`minio.tenancey.test`)
      traefik.http.routers.tenancey-minio.entrypoints: websecure
      traefik.http.routers.tenancey-minio.priority: "100"
      traefik.http.routers.tenancey-minio.service: tenancey-minio
      traefik.http.services.tenancey-minio.loadbalancer.server.port: "9001"
    volumes:
      - minio-data:/data
    # No healthcheck: the image has no shell or client to run one (check from the Mac with curl).
    restart: unless-stopped

  # One-off asset build: docker compose run --rm node
  node:
    image: node:22.12-bookworm-slim
    profiles: [tools] # not started by `docker compose up`
    working_dir: /var/www/html
    command: sh -c "npm ci && npm run dev"
    environment:
      ASSET_BUILD_DIRECTORY: build-docker
      VITE_REVERB_HOST: ws.tenancey.test # browser → Traefik → reverb:8080
      VITE_REVERB_PORT: "443"
      VITE_REVERB_SCHEME: https
    volumes:
      - .:/var/www/html
      - node-modules:/var/www/html/node_modules # Linux packages; the Mac's node_modules stays untouched

volumes:
  mysql-data:
  redis-data:
  node-modules:
  minio-data:

networks:
  edge:
    external: true # created by ~/Sites/docker-edge (start that first)
