# Local development for tenancey. Guide: docs/DOCKER.md
# Port mode (default): http://localhost:8000, tenants at http://{subdomain}.localhost:8000.
# docker-edge mode (HTTPS on tenancey.test): add COMPOSE_FILE=compose.yaml:compose.edge.yaml to .env.
name: tenancey
# Laravel settings live in .env, and so do the published ports below.

# Shared by the four PHP services: same image, same code, same settings.
x-php: &php
  build: docker/php
  image: tenancey-php:dev
  # tini as PID 1, passing signals on to PHP. Without it PHP is PID 1, and Linux drops a SIGTERM
  # sent to PID 1 before PHP has installed its handler: a stop right after a start then waits the
  # whole stop_grace_period (660s for horizon) and ends in SIGKILL.
  init: true
  volumes:
    - .:/var/www/html
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_started
    minio:
      condition: service_started # no healthcheck to wait for (see the service)
  restart: unless-stopped

services:
  app:
    <<: *php # PHP-FPM, the image's default command

  horizon:
    <<: *php
    command: php artisan horizon
    stop_signal: SIGTERM # the image's SIGQUIT is for PHP-FPM; Horizon shuts down gracefully on SIGTERM
    stop_grace_period: 660s # must exceed the longest job timeout (600s), like supervisor's stopwaitsecs

  reverb:
    <<: *php
    command: php artisan reverb:start
    ports:
      - "127.0.0.1:${FORWARD_REVERB_PORT:-8080}:8080" # browser: ws://localhost:8080; PHP containers: reverb:8080
    stop_signal: SIGTERM # as for horizon: Reverb shuts down on SIGTERM, not the image's SIGQUIT
    stop_grace_period: 30s

  scheduler:
    <<: *php
    command: php artisan schedule:work # runs due tasks every minute; replaces a cron entry
    # No stop_signal: schedule:work handles SIGQUIT (and SIGTERM) itself, finishing running tasks first.

  nginx:
    image: nginx:1.30-alpine
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:80" # the central domain and every tenant
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: docker # local dev only; matches DB_PASSWORD for the PHP services
    ports:
      - "127.0.0.1:${FORWARD_DB_PORT:-3307}:3306" # this machine only; 3307 so a local MySQL can keep 3306
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pdocker"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    volumes:
      - redis-data:/data
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.29
    ports:
      - "127.0.0.1:${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025" # inbox (SMTP 1025 stays inside the network)
    restart: unless-stopped

  minio:
    # Chainguard's free tier only publishes :latest, so pin the digest (:latest on 2026-10-12).
    image: cgr.dev/chainguard/minio@sha256:dc455cdd4db6e390b1b26514f15ff37681a777bf8dab41aac445a0259f751e56
    command: server /data --console-address :9001 # the image's entrypoint is `minio`
    environment:
      MINIO_ROOT_USER: minioadmin # local dev only, like MySQL's password
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_CONSOLE_URL:-http://localhost:9001} # the dashboard's public address
    ports:
      - "127.0.0.1:${FORWARD_MINIO_PORT:-9000}:9000" # S3 API, what links are signed for (MINIO_PUBLIC_ENDPOINT)
      - "127.0.0.1:${FORWARD_MINIO_CONSOLE_PORT:-9001}:9001" # dashboard
    volumes:
      - minio-data:/data
    # No healthcheck: the image has no shell or client to run one (check from the Mac with curl).
    restart: unless-stopped

  # One-off asset build: docker compose run --rm node
  node:
    image: node:22.12-bookworm-slim
    profiles: [tools] # not started by `docker compose up`
    working_dir: /var/www/html
    command: sh -c "npm ci && npm run dev"
    volumes:
      - .:/var/www/html
      - node-modules:/var/www/html/node_modules # Linux packages; the Mac's node_modules stays untouched

volumes:
  mysql-data:
  redis-data:
  node-modules:
  minio-data:

